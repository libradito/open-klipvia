# Klipvia as static files.
#
# Same three concerns as render.yaml and public/_headers, said in nginx: the
# origin trial that turns WebMCP on, revalidation for unbundled modules, and a
# single page that owns its own routing.
#
# The headers are repeated per location on purpose. nginx's `add_header` does
# not inherit into a block that declares one of its own, so a location that
# sets its own Cache-Control silently drops everything set above it. Pulling
# the shared set into an include is the only way to say it once and mean it
# everywhere.

server {
  listen       80;
  listen       [::]:80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # The whole app is text. Compressed it is a fraction of the size, and a
  # judge on hotel wifi is still a judge.
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/css application/javascript application/json
                  image/svg+xml application/manifest+json text/markdown;

  location / {
    include /etc/nginx/klipvia-common.conf;
    # The app ships as unbundled ES modules with stable names, so nothing
    # carries a content hash. Without revalidation a redeploy serves some
    # visitors a mix of old and new modules, and a stale module against a
    # fresh one fails in ways that read exactly like logic bugs.
    add_header Cache-Control "no-cache" always;
    # One page, its own routing.
    try_files $uri $uri/ /index.html;
  }

  # The two directories whose contents never change under the same name.
  location /vendor/ {
    include /etc/nginx/klipvia-common.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /brand/ {
    include /etc/nginx/klipvia-common.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # Netlify and Cloudflare Pages read these two; nginx has the same rules in
  # this file. Serving them would only hand a visitor the token.
  location ~ ^/(_headers|_redirects)$ { return 404; }
}
