# Headers every response gets, wherever it comes from.
#
# Included once per location block rather than declared at server level:
# nginx's `add_header` does not inherit into a block that declares one of its
# own, and every location here sets its own Cache-Control.

# Written at container start from WEBMCP_ORIGIN_TRIAL_TOKEN, or left empty.
include /tmp/klipvia-origin-trial.conf;

add_header Cross-Origin-Opener-Policy "same-origin" always;

# Nothing here needs to be told which editor you are using, or by whom.
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
